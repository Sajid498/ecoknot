spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/ecoknot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT
# Use JWT_SECRET environment variable outside local development.
jwt.secret=${JWT_SECRET:ecoknot-local-development-secret-key-change-before-production-2026}
jwt.expiration-ms=86400000

