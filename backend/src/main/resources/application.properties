
spring.application.name=backend

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecoknot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=${PORT:8080}

# JWT configuration
jwt.secret=${JWT_SECRET:ecoknot-local-development-secret-key-change-before-production-2026}
jwt.expiration-ms=86400000
